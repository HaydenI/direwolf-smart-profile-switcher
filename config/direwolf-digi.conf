###############################################################################
#                     AUDIO CODEC & CHANNEL CONFIGURATION                     #
###############################################################################
# Digirig C-Media USB Audio device (Card 1, Device 0)
ADEVICE plughw:1,0
ACHANNELS 1
CHANNEL 0

# Your Amateur Callsign & SSID
# Rules (Understanding-APRS-Packets.pdf Sec 1.1):
# - 1 to 6 UPPER CASE letters/digits, optional SSID 1-15 (never -0, no spaces).
# - Replace N0CALL-9 with your real callsign; Direwolf disables beacons for N0CALL.
MYCALL N0CALL-9

# 1200 baud Bell 202 AFSK
# Best Practice for single-core Pi Zero W: append "/3" (MODEM 1200 /3) if CPU > 70%
MODEM 1200

# Disable single-bit CRC error "fixup" (WB2OSZ APRS Best Practice):
# Prevents corrupted noise from being "repaired" into bogus packets & gated to APRS-IS
FIX_BITS 0

# Hardware PTT control using the Digirig CP2102 RTS serial line
# BEST PRACTICE: Replace /dev/ttyUSB0 with /dev/serial/by-id/usb-Silicon_Labs_CP2102_...
# so Linux never swaps your Digirig PTT port with your USB GPS on reboot, and set
# USBAUTO="false" in /etc/default/gpsd so gpsd does not key your transmitter.
PTT /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_YOUR_SERIAL_ID-if00-port0 RTS

# CSMA Channel Access & PTT Timing (in 10 ms units, APRS-Digipeaters.pdf Sec 5.2):
# - DWAIT 0: Wait 0 ms after carrier drop; digipeated frames are expedited immediately
# - SLOTTIME 10 (100 ms) & PERSIST 63 (~25% probability): Standard CSMA backoff for beacons
# - TXDELAY 30 (300 ms): Time for IC-2200H PA/PLL to stabilize before sending AFSK tones
# - TXTAIL 10 (100 ms): Hold PTT briefly after frame ends so trailing FCS bits aren't clipped
DWAIT 0
SLOTTIME 10
PERSIST 63
TXDELAY 30
TXTAIL 10


###############################################################################
#                      VIRTUAL TNC SERVERS (IN-CAB MAPPING)                   #
###############################################################################
# Expose KISS (port 8001) and AGWPE (port 8000) over the local Starlink Wi-Fi LAN.
# Note (APRS-Digipeaters.pdf Sec 5.2): Let Direwolf handle digipeating internally
# rather than an external KISS app, because KISS cannot expedite digipeated frames.
AGWPORT 8000
KISSPORT 8001


###############################################################################
#                         GPSD & SMARTBEACONING ENGINE                        #
###############################################################################
# Option A: Connect to local gpsd daemon (requires libgps-dev installed BEFORE cmake ..)
GPSD localhost 2947

# Option B (No rebuild / no gpsd required): Read NMEA sentences directly from USB GPS serial port.
# If you prefer not to rebuild Direwolf with libgps-dev, comment out "GPSD localhost 2947" above,
# stop gpsd (sudo systemctl stop gpsd.socket gpsd.service), and uncomment GPSNMEA below:
#GPSNMEA /dev/ttyACM0

# SmartBeaconing Algorithm Parameters:
# Syntax: SMARTBEACONING <fast_speed> <fast_rate> <slow_speed> <slow_rate> <turn_time> <turn_angle> <turn_slope>
# - Fast: At/above 60 mph, beacon every 1:00 (60 seconds)
# - Slow: At/below 5 mph (parked/camped), beacon every 30:00 (30 minutes)
# - Cornering: Min 0:15 (15s) between turn beacons; 25 deg min turn + 255/mph slope
SMARTBEACONING 60 1:00 5 30:00 0:15 25 255

# Dynamic GPS Tracker Beacons (Understanding-APRS-Packets.pdf Sec 3.1-3.4 & 5.14-5.15):
# - Do NOT add power/height/gain (PHG) to TBEACON: TBEACON sends course/speed (cse/spd),
#   and APRS forbids combining cse/spd and PHG in the same packet (Sec 3.2 & 5.15).
# - Optional QSY Support (Sec 3.3 & 5.14): Add freq=146.520 if you want your crew's
#   handhelds to have one-button TUNE/QSY to your 4x4's voice simplex frequency.
# - Identical comment= strings ensure APRS-IS's 30s dupe filter drops any RF copy gated
#   by a nearby iGate while preserving automatic RF failover if Starlink drops in a canyon.
TBEACON sendto=IG delay=0:15 every=30:00 symbol="\k" overlay=S altitude=1 comment="4x4 Digi/iGate | Starlink"
TBEACON delay=0:15 every=30:00 symbol="\k" overlay=S altitude=1 comment="4x4 Digi/iGate | Starlink"


###############################################################################
#                  RF DIGIPEATER (10W TRAIL RELAY ENGINE)                     #
###############################################################################
# Suppress duplicate packets within a 30-second window (APRS-Digipeaters.pdf Sec 5.3 & 9)
DEDUPE 30

# Only digipeat packets heard DIRECTLY by the 4x4 (Successful-APRS-IGate-Operation.pdf p. 17):
# "! d/*" blocks packets that have already been digipeated by distant mountaintop repeaters
# so your 4x4 only relays local trail handhelds/rigs and never echoes mountain traffic.
FILTER 0 0 ! d/*

# Digipeat from Channel 0 back out to Channel 0 (APRS-Digipeaters.pdf Sec 8.1, 9, 10):
# - Traps excessive paths (^WIDE[3-7]-[1-7]$) into a single hop and relays WIDE1-1 / WIDE2-N.
# - Tip (Sec 10, p. 18): For a strict "fill-in" digipeater that only responds to WIDE1-1,
#   use: DIGIPEAT 0 0 ^WIDE1-1$ ^WIDE1-1$
DIGIPEAT 0 0 ^WIDE[3-7]-[1-7]$|^TEST$ ^WIDE[12]-[12]$


###############################################################################
#             STARLINK BIDIRECTIONAL APRS-IS INTERNET GATEWAY (IGATE)         #
###############################################################################
# North American Tier 2 APRS-IS Core Rotate Server (Successful-APRS-IGate-Operation.pdf p. 5)
IGSERVER noam.aprs2.net

# Your Callsign and generated 5-digit APRS-IS validation passcode
# IMPORTANT: Replace N0CALL-9 and 12345 with your real callsign and passcode!
IGLOGIN N0CALL 12345

# Bidirectional IS-to-RF Path (Successful-APRS-IGate-Operation.pdf p. 3-6 & Understanding p. 51-52):
# - Strongly recommended over receive-only so handhelds receive message ACKs and replies.
# - Uses 1 hop (WIDE1-1) and NEVER appends RFONLY/NOGATE (looping is prevented automatically
#   by TCPIP inside the 3rd-party "}" packet header per Understanding-APRS-Packets.pdf Sec 2.6 & 5.24).
IGTXVIA 0 WIDE1-1

# Client-Side IGate Filtering (Successful-APRS-IGate-Operation.pdf p. 11 & 18):
# Direwolf's built-in defaults already pass all valid RF packets to APRS-IS and apply
# "FILTER IG 0 i/180" (only gating messages addressed to stations heard on local RF in the
# last 180 minutes). Leaving explicit "FILTER ... IG" and "FILTER IG ..." lines omitted
# uses those exact defaults without triggering Direwolf's startup warning banners.

# Courtesy Position Report for Message Senders (Successful-APRS-IGate-Operation.pdf p. 19):
# Transmits 1 position packet of a remote sender after gating their message to a local handheld.
IGMSP 1

# Rate-limit IS-to-RF transmissions (max 6 packets/minute, 10 packets/5 minutes, p. 19)
IGTXLIMIT 6 10

# Send IGate health & packet counters directly to APRS-IS over Starlink every 30 mins (p. 7-8)
IBEACON sendto=IG delay=3:00 every=30:00